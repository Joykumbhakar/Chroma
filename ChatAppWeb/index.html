<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Secure Chat</title>
    <!-- Tailwind CSS (for layout utilities only, relying on macOS css for aesthetics) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body style="margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background: #ffffff;">
    <div class="mac-messages-app" style="width: 100%; height: 100%; background: transparent;">
        <!-- Only the Main Pane (no sidebar since it's a separate chat screen) -->
        <div class="msg-main-pane" style="width: 100%; max-width: 800px; margin: 0 auto; box-shadow: 0 0 20px rgba(0,0,0,0.05);">
                
                <!-- Chat Top Header -->
                <div class="msg-chat-header window-header">
                    <div class="msg-header-contact-info">
                        <div class="relative">
                            <div class="msg-header-avatar" style="background: transparent;">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" style="width: 100%; height: 100%; display: block;">
                                    <defs>
                                        <linearGradient id="bgGradient-chat" x1="0%" y1="0%" x2="0%" y2="100%">
                                            <stop offset="0%" stop-color="#7E22CE"></stop>
                                            <stop offset="100%" stop-color="#4C1D95"></stop>
                                        </linearGradient>
                                        <linearGradient id="silGradient-chat" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
                                            <stop offset="10%" stop-color="#FFFFFF"></stop>
                                            <stop offset="90%" stop-color="#D5D9E0"></stop>
                                        </linearGradient>
                                        <linearGradient id="borderGradient-chat" x1="0%" y1="0%" x2="0%" y2="100%">
                                            <stop offset="0%" stop-color="rgba(255,255,255,0.6)"></stop>
                                            <stop offset="100%" stop-color="rgba(0,0,0,0.3)"></stop>
                                        </linearGradient>
                                        <clipPath id="circleClip-chat">
                                            <circle cx="256" cy="256" r="256"></circle>
                                        </clipPath>
                                    </defs>
                                    <circle cx="256" cy="256" r="256" fill="url(#bgGradient-chat)"></circle>
                                    <circle cx="256" cy="256" r="254.5" fill="none" stroke="url(#borderGradient-chat)" stroke-width="3"></circle>
                                    <g clip-path="url(#circleClip-chat)">
                                        <circle cx="256" cy="165" r="95" fill="url(#silGradient-chat)"></circle>
                                        <circle cx="256" cy="530" r="250" fill="url(#silGradient-chat)"></circle>
                                    </g>
                                </svg>
                            </div>
                            <div id="onlineDot" class="absolute bottom-[2px] right-[2px] w-[10px] h-[10px] bg-green-500 border-[1.5px] border-white rounded-full z-10 transition-opacity duration-300"></div>
                        </div>
                        <div class="msg-header-meta">
                            <span class="msg-header-name">Sarah Jenkins <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" style="width: 16px; height: 16px; display: inline-block; vertical-align: middle; margin-left: 4px;">
                                <defs>
                                    <linearGradient id="bd-bg-chat" x1="0%" y1="0%" x2="0%" y2="100%">
                                        <stop offset="0%" stop-color="#3B82F6"></stop>
                                        <stop offset="100%" stop-color="#1D4ED8"></stop>
                                    </linearGradient>
                                    <linearGradient id="bd-border-chat" x1="0%" y1="0%" x2="100%" y2="100%">
                                        <stop offset="0%" stop-color="rgba(255,255,255,0.7)"></stop>
                                        <stop offset="50%" stop-color="rgba(255,255,255,0.1)"></stop>
                                        <stop offset="100%" stop-color="rgba(0,0,0,0.4)"></stop>
                                    </linearGradient>
                                </defs>
                                <path d="M22.5 12.5c0-1.58-.875-2.95-2.148-3.6.154-.435.238-.905.238-1.4 0-2.21-1.71-3.998-3.918-3.998-.47 0-.92.084-1.336.25C14.818 2.415 13.51 1.5 12 1.5s-2.816.917-3.337 2.25c-.416-.165-.866-.25-1.336-.25-2.21 0-3.918 1.79-3.918 4 0 .495.084.965.238 1.4-1.273.65-2.148 2.02-2.148 3.6 0 1.46.74 2.746 1.865 3.45-.06.31-.09.63-.09.95 0 2.21 1.71 4 3.918 4 .47 0 .92-.085 1.336-.25.52 1.335 1.826 2.25 3.337 2.25s2.816-.915 3.337-2.25c.416.165.866.25 1.336.25 2.21 0 3.918-1.79 3.918-4 0-.32-.03-.64-.09-.95 1.125-.705 1.865-1.99 1.865-3.45z" fill="url(#bd-bg-chat)" stroke="url(#bd-border-chat)" stroke-width="0.6" stroke-linejoin="round"></path>
                                <path d="M 9.5 16.5 l -3.5 -3.5 l 1.25 -1.25 l 2.25 2.25 l 6.75 -6.75 l 1.25 1.25 z" fill="#FFFFFF"></path>
                            </svg></span>
                            <span id="headerStatus" class="msg-header-sub transition-colors duration-300">Verified Business</span>
                        </div>
                    </div>
                    
                    <div class="msg-header-actions">
                        <button class="msg-tool-btn" title="FaceTime Video">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polygon points="23 7 16 12 23 17 23 7"></polygon>
                                <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
                            </svg>
                        </button>
                        <button class="msg-tool-btn" title="Info">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"></circle>
                                <line x1="12" y1="16" x2="12" y2="12"></line>
                                <line x1="12" y1="8" x2="12.01" y2="8"></line>
                            </svg>
                        </button>
                    </div>
                </div>
                
                <!-- Selection Header (Hidden by default) -->
                <div id="selectionHeader" class="msg-chat-header window-header hidden !bg-blue-500 !text-white z-20 absolute top-0 w-full left-0 flex justify-between px-4 transition-transform duration-300">
                    <button class="font-medium text-white" onclick="cancelSelection()">Cancel</button>
                    <span class="font-semibold text-white"><span id="selectionCount">0</span> Selected</span>
                    <button class="font-medium text-white" onclick="forwardSelected()">Forward</button>
                </div>

                <!-- Messages Thread -->
                <div class="msg-thread" id="chatArea" style="position: relative;">
                    
                    <!-- Welcome Screen -->
                    <div id="welcomeScreen" class="flex flex-col items-center justify-center h-full text-center px-6">
                        <div class="mb-4 text-gray-400">
                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                        </div>
                        <h2 class="text-lg font-semibold text-[#1d1d1f] mb-1">End-to-End Encrypted</h2>
                        <p class="text-[13px] text-[#8e8e93] mb-6">All Messages are end to end encrypted and even we can't see them.</p>
                        
                        <h3 class="text-[11px] font-bold text-[#8e8e93] mb-3 uppercase tracking-wider">Say Hello to Sarah Jenkins</h3>
                        
                        <div class="flex flex-col gap-2 w-full max-w-[200px] mx-auto">
                            <button class="welcome-btn" onclick="sendQuickMessage('Hello! 👋')">Hello! 👋</button>
                            <button class="welcome-btn" onclick="sendQuickMessage('Share a Post')">Share a Post</button>
                            <button class="welcome-btn" onclick="sendQuickMessage('How\\'s it going?')">How's it going?</button>
                        </div>
                    </div>

                    <!-- Dynamic Messages Container -->
                    <div id="messagesContainer" style="display: none; flex-direction: column;">
                        <!-- Messages go here -->
                    </div>
                </div>

                <!-- Context Menu / Reaction Overlay -->
                <div id="contextOverlay" class="absolute inset-0 bg-black/10 backdrop-blur-[2px] z-40 opacity-0 pointer-events-none transition-opacity duration-200">
                    <!-- Rendered via JS -->
                </div>

                <!-- Attachment Menu -->
                <div id="attachmentMenu" class="absolute bottom-[70px] left-4 bg-white/90 backdrop-blur-xl rounded-[14px] shadow-lg border border-[rgba(0,0,0,0.1)] w-64 transform scale-95 opacity-0 pointer-events-none transition-all duration-200 origin-bottom-left z-20 overflow-hidden">
                    <div class="mac-menu-item text-blue-500"><i class="fas fa-image w-8 text-center text-lg"></i> <span>Photos & Videos</span></div>
                    <div class="mac-menu-item text-purple-500"><i class="fas fa-share-nodes w-8 text-center text-lg"></i> <span>Send a Post</span></div>
                    <div class="mac-menu-item text-green-500"><i class="fas fa-user w-8 text-center text-lg"></i> <span>Send Profile</span></div>
                    <div class="mac-menu-item text-orange-500"><i class="fas fa-address-book w-8 text-center text-lg"></i> <span>Send Contact</span></div>
                    <div class="mac-menu-item text-blue-600"><i class="fas fa-file-lines w-8 text-center text-lg"></i> <span>Send Document</span></div>
                    <div class="mac-menu-item text-pink-500"><i class="fas fa-headphones w-8 text-center text-lg"></i> <span>Send Audio File</span></div>
                </div>

                <!-- Audio Preview UI -->
                <div id="audioPreview" class="absolute bottom-[70px] w-[calc(100%-32px)] left-4 transform translate-y-10 opacity-0 pointer-events-none transition-all duration-300 z-20">
                    <div class="msg-input-pill flex items-center gap-3 w-full p-2">
                        <button class="msg-input-action-btn text-red-500 flex-shrink-0" onclick="cancelAudio()" style="background: rgba(255,59,48,0.1)">
                            <i class="fas fa-trash"></i>
                        </button>
                        <div class="flex-1 flex items-center justify-between">
                            <button class="msg-input-action-btn flex-shrink-0"><i class="fas fa-play"></i></button>
                            <div class="w-full h-1.5 bg-[rgba(0,0,0,0.1)] rounded-full mx-3 relative">
                                <div class="absolute left-0 top-0 h-full w-1/3 bg-blue-500 rounded-full"></div>
                            </div>
                            <span class="text-[12px] font-medium text-[#8e8e93]">0:04</span>
                        </div>
                        <button class="msg-input-action-btn text-purple-600 flex-shrink-0" title="Voice Changer">
                            <i class="fas fa-magic"></i>
                        </button>
                    </div>
                </div>

                <!-- Input Box (macOS exact style) -->
                <div class="msg-input-bar" style="position: relative; z-index: 10;">
                    
                    <div id="replyContainer" class="hidden absolute bottom-[100%] left-0 w-full bg-[rgba(245,245,245,0.95)] backdrop-blur-md border-t border-b border-[rgba(0,0,0,0.1)] px-4 py-2 items-center justify-between z-10 transition-all rounded-t-xl" style="transform: translateY(1px);">
                        <div class="flex flex-col border-l-[3px] border-blue-500 pl-2 overflow-hidden">
                            <span class="text-[12px] font-semibold text-blue-500" id="replyName">Sarah Jenkins</span>
                            <span class="text-[13px] text-gray-500 truncate max-w-[250px]" id="replyText">Message preview</span>
                        </div>
                        <button onclick="cancelReply()" class="text-gray-400 hover:text-gray-600 p-1">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                        </button>
                    </div>

                    <!-- Recording Overlay inside input bar -->
                    <div id="recordingOverlay" class="absolute inset-0 bg-[rgba(255,255,255,0.95)] backdrop-blur-md rounded-t-xl flex items-center px-6 justify-between opacity-0 pointer-events-none transition-opacity z-30">
                        <div class="flex items-center gap-2 text-red-500 animate-pulse">
                            <div class="w-2.5 h-2.5 rounded-full bg-red-500"></div>
                            <span class="font-medium text-[13px]">Recording...</span>
                        </div>
                        <span class="text-[#8e8e93] font-medium text-[13px] tabular-nums" id="recordTimer">0:00</span>
                    </div>

                    <div class="msg-input-pill">
                        <button id="attachBtn" type="button" class="msg-input-action-btn" title="Apps & Attachments" style="transition: transform 0.3s ease;">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                        </button>

                        <div id="messageInput" contenteditable="true" data-placeholder="iMessage" class="msg-text-input outline-none overflow-y-auto max-h-[100px] empty-placeholder" style="cursor: text;"></div>

                        <button id="actionBtn" type="button" class="msg-send-btn flex items-center justify-center transition-all" title="Record Audio" style="padding: 0;">
                            <div id="iconMic" class="flex items-center justify-center w-full h-full"><i data-lucide="mic" stroke-width="1.5" style="width: 16px; height: 16px; color: white;"></i></div>
                            <div id="iconSend" class="hidden items-center justify-center w-full h-full" style="transform: translate(-1px, 1px);"><i data-lucide="send" stroke-width="1.5" style="width: 16px; height: 16px; color: white;"></i></div>
                        </button>
                    </div>
                </div>

            </div>
    </div>
    
    <script>
        // Initialize Lucide icons on load
        lucide.createIcons();
    </script>
    <script src="script.js"></script>
</body>
</html>
