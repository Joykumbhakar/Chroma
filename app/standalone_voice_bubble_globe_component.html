<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Optical 3D Liquid Glass Voice Globe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --ios-blue: #0078FE;
            --ios-blue-hover: #0066D6;
            --app-bg: #ffffff;
            --card-bg: rgba(255, 255, 255, 0.94);
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --input-bg: #f4f6f8;
            --border-subtle: rgba(15, 23, 42, 0.07);
            --orb-core: radial-gradient(circle at 30% 25%, #e0f2fe 0%, #60a5fa 38%, #0078FE 74%, #1e3a8a 100%);
            --orb-shadow: 0 26px 58px -12px rgba(15, 23, 42, 0.18), 0 10px 28px -6px rgba(0, 120, 254, 0.14), inset 0 0 0 1px rgba(15, 23, 42, 0.06);
        }

        html.dark {
            --app-bg: #0f172a;
            --card-bg: rgba(15, 23, 42, 0.94);
            --text-dark: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: #1e293b;
            --border-subtle: rgba(255, 255, 255, 0.09);
            --orb-core: radial-gradient(circle at 30% 25%, #38bdf8 0%, #0284c7 35%, #1d4ed8 72%, #091536 100%);
            --orb-shadow: 0 28px 64px -12px rgba(0, 0, 0, 0.65), 0 10px 28px -6px rgba(0, 120, 254, 0.22), inset 0 0 0 1px rgba(255, 255, 255, 0.10);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #f1f5f9;
            margin: 0;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.3s ease;
        }

        html.dark body {
            background-color: #020617;
        }

        .footer-wrapper {
            background-color: var(--app-bg);
            padding: 10px 16px max(14px, env(safe-area-inset-bottom));
            position: relative;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            border-top: 1px solid var(--border-subtle);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .container-ia-chat {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            width: 100%;
            max-width: 896px;
            margin: 0 auto;
        }

        .container-upload-files {
            position: absolute;
            left: 0;
            display: flex;
            align-items: center;
            color: #94a3b8;
            transition: all 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
            gap: 2px;
        }

        .container-upload-files .upload-file {
            width: 34px; height: 34px;
            display: flex; align-items: center; justify-content: center;
            padding: 5px; cursor: pointer; border-radius: 50%;
            transition: all 0.25s ease;
        }

        .container-upload-files .upload-file:hover {
            color: var(--ios-blue);
            background-color: rgba(0, 120, 254, 0.1);
            transform: scale(1.08);
        }

        .input-text {
            width: calc(100% - 114px); margin-left: 114px;
            padding: 0.72rem 1.1rem; padding-right: 78px;
            border-radius: 50px;
            border: 1px solid var(--border-subtle); outline: none;
            background-color: var(--input-bg); color: var(--text-dark);
            font-size: 15px; line-height: 20px;
            transition: all 0.38s cubic-bezier(0.2, 0.8, 0.2, 1);
            z-index: 10;
        }

        .input-text::placeholder { color: #94a3b8; }

        .input-text:focus,
        .input-text:not(:placeholder-shown) {
            width: calc(100% - 44px); margin-left: 44px;
            background-color: var(--app-bg); border-color: rgba(0, 120, 254, 0.35);
            box-shadow: 0 4px 14px rgba(0, 120, 254, 0.07);
        }

        .input-text:focus ~ .container-upload-files,
        .input-text:not(:placeholder-shown) ~ .container-upload-files {
            opacity: 0; visibility: hidden; pointer-events: none; transform: translateX(-10px);
        }

        .input-text:focus ~ .label-files,
        .input-text:not(:placeholder-shown) ~ .label-files {
            transform: translateX(0) translateY(-50%) scale(1); opacity: 1;
            visibility: visible; pointer-events: all;
        }

        .input-text:not(:placeholder-shown) ~ .btn-send {
            transform: translateX(0) translateY(-50%) scale(1); opacity: 1;
            visibility: visible; pointer-events: all;
        }

        .input-text:not(:placeholder-shown) ~ .label-voice {
            transform: translateX(0) translateY(-50%) scale(0.25); opacity: 0;
            visibility: hidden; pointer-events: none;
        }

        .input-voice { display: none; }

        .input-voice:checked ~ .container-upload-files,
        .input-voice:checked ~ .input-text,
        .input-voice:checked ~ .label-files,
        .input-voice:checked ~ .btn-emoji {
            opacity: 0; visibility: hidden; pointer-events: none; transform: scale(0.95);
        }

        .label-files {
            position: absolute; top: 50%; left: 0;
            transform: translateX(-15px) translateY(-50%) scale(0.8);
            display: flex; align-items: center; justify-content: center;
            width: 36px; height: 36px; color: #fff; background-color: var(--ios-blue);
            border-radius: 50px; cursor: pointer; opacity: 0; visibility: hidden;
            pointer-events: none; transition: all 0.38s cubic-bezier(0.2, 0.8, 0.2, 1);
            z-index: 11; box-shadow: 0 2px 8px rgba(0, 120, 254, 0.3);
        }

        .label-voice, .btn-send {
            position: absolute; top: 50%; right: 0.25rem;
            transform: translateX(0) translateY(-50%) scale(1);
            width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            padding: 6px; border: none; outline: none; cursor: pointer;
            transition: all 0.48s cubic-bezier(0.2, 0.8, 0.2, 1); z-index: 20;
        }

        .btn-emoji {
            position: absolute; top: 50%; right: 2.6rem; transform: translateY(-50%);
            width: 32px; height: 32px;
            display: flex; align-items: center; justify-content: center;
            color: #94a3b8; border-radius: 50%; cursor: pointer; transition: all 0.2s ease; z-index: 15;
        }

        .input-voice:checked ~ .label-voice {
            background-color: var(--card-bg);
            backdrop-filter: blur(24px) saturate(190%);
            -webkit-backdrop-filter: blur(24px) saturate(190%);
            right: calc(50% - 152px);
            width: 304px; height: 312px;
            border-radius: 2.5rem;
            box-shadow: var(--orb-shadow);
            transform: translateX(0) translateY(-88%) scale(1);
            cursor: default;
        }

        .input-voice:checked ~ .label-voice .icon-voice { opacity: 0; transform: scale(0.5); pointer-events: none; }
        .input-voice:checked ~ .label-voice .text-voice > * { opacity: 1; transform: translateY(0); pointer-events: auto; }

        .label-voice { color: #94a3b8; overflow: hidden; }
        .label-voice:hover { color: var(--ios-blue); }
        .label-voice .icon-voice { position: absolute; transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); }

        .label-voice .text-voice {
            position: absolute; inset: 1.25rem; display: flex; flex-direction: column;
            align-items: center; justify-content: space-between; pointer-events: none; z-index: 10;
        }

        .label-voice .text-voice > * {
            opacity: 0; transform: translateY(8px);
            transition: all 0.38s cubic-bezier(0.2, 0.8, 0.2, 1) 0.1s;
            margin: 0;
        }

        .voice-header-row {
            display: flex; align-items: center; gap: 8px;
            background: rgba(148, 163, 184, 0.08);
            padding: 4px 12px; border-radius: 999px;
            border: 1px solid var(--border-subtle);
        }

        .voice-rec-dot {
            width: 7px; height: 7px; border-radius: 50%;
            background-color: var(--ios-blue);
            box-shadow: 0 0 8px var(--ios-blue);
            animation: recBlink 1.2s ease-in-out infinite;
        }

        @keyframes recBlink {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.35; transform: scale(0.82); }
        }

        .voice-status-title {
            font-size: 14.5px; font-weight: 600; letter-spacing: -0.01em;
            color: transparent;
            background-image: linear-gradient(
                -40deg,
                var(--text-dark) 0% 35%,
                var(--ios-blue) 45%,
                #38bdf8 50%,
                var(--ios-blue) 55%,
                var(--text-dark) 65% 100%
            );
            background-clip: text; -webkit-background-clip: text;
            background-size: 800px;
            animation: text-light 3.8s linear infinite;
        }

        .voice-timer-badge {
            font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums;
            color: var(--ios-blue); background: rgba(0, 120, 254, 0.12);
            padding: 1.5px 7px; border-radius: 999px;
        }

        @keyframes text-light {
            0% { background-position: 0px; }
            100% { background-position: 800px; }
        }

        .voice-actions-row {
            display: flex; align-items: center; gap: 6px; width: 100%; justify-content: center;
        }

        .voice-action-btn {
            font-size: 11.5px; font-weight: 600;
            padding: 6px 11px; border-radius: 999px;
            display: inline-flex; align-items: center; gap: 4px;
            cursor: pointer; transition: all 0.2s ease; border: none; outline: none;
        }

        .voice-btn-cancel { color: var(--text-muted); background: rgba(148, 163, 184, 0.12); }
        .voice-btn-cancel:hover { background: rgba(239, 68, 68, 0.12); color: #ef4444; }
        .voice-btn-text { color: var(--ios-blue); background: rgba(0, 120, 254, 0.10); }
        .voice-btn-text:hover { background: rgba(0, 120, 254, 0.18); }
        .voice-btn-send { color: #ffffff; background: var(--ios-blue); box-shadow: 0 4px 12px rgba(0, 120, 254, 0.32); }
        .voice-btn-send:hover { background: var(--ios-blue-hover); transform: translateY(-1px); }

        .btn-send {
            opacity: 0; visibility: hidden; pointer-events: none;
            transform: translateY(-50%) scale(0.25); color: #ffffff;
            background: var(--ios-blue); border-radius: 50%;
            box-shadow: 0 4px 12px rgba(0, 120, 254, 0.3);
        }

        .ai {
            --s: 250px;
            --p: calc(var(--s) / 4);
            width: var(--s); aspect-ratio: 1; padding: var(--p);
            display: grid; place-items: center; position: absolute;
            left: 50%; top: 48%; transform: translate(-50%, -50%);
            animation: circle1 5s ease-in-out infinite;
            opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
        }
        
        .input-voice:checked ~ .label-voice .ai {
            opacity: 1; transition-delay: 0.1s;
        }

        .ai::before, .ai::after {
            content: ""; position: absolute; top: 50%; left: 50%;
            width: 52%; height: 52%; border-radius: 50%;
            border: 1.5px solid rgba(0, 120, 254, 0.38);
            box-shadow: 0 0 24px rgba(0, 120, 254, 0.20);
            transform: translate(-50%, -50%);
            animation: wave 2.1s cubic-bezier(0.16, 1, 0.3, 1) infinite;
        }
        .ai::after { animation-delay: 0.7s; }

        @keyframes wave {
            0% { transform: translate(-50%, -50%) scale(0.98); opacity: 0.85; }
            100% { transform: translate(-50%, -50%) scale(1.56); opacity: 0; }
        }

        @keyframes ai1 {
            0% { transform: rotate(0deg) translate(45%) scale(0.95); opacity: 0.5; }
            25% { transform: rotate(90deg) translate(45%) scale(1.65); opacity: 1; }
            50% { transform: rotate(180deg) translate(45%) scale(0.8); opacity: 0.55; }
            75% { transform: rotate(270deg) translate(45%) scale(1.3); opacity: 1; }
            100% { transform: rotate(360deg) translate(45%) scale(0.95); opacity: 0.5; }
        }
        @keyframes ai2 {
            0% { transform: rotate(90deg) translate(42%) scale(0.65); opacity: 0.9; }
            25% { transform: rotate(180deg) translate(42%) scale(1.55); opacity: 0.35; }
            50% { transform: rotate(270deg) translate(42%) scale(1.05); opacity: 0.8; }
            75% { transform: rotate(360deg) translate(42%) scale(0.85); opacity: 0.4; }
            100% { transform: rotate(450deg) translate(42%) scale(0.65); opacity: 0.9; }
        }
        @keyframes ai3 {
            0% { transform: rotate(180deg) translate(44%) scale(0.85); opacity: 0.85; }
            25% { transform: rotate(270deg) translate(44%) scale(1.45); opacity: 0.6; }
            50% { transform: rotate(360deg) translate(44%) scale(0.7); opacity: 0.5; }
            75% { transform: rotate(450deg) translate(44%) scale(1.3); opacity: 0.85; }
            100% { transform: rotate(540deg) translate(44%) scale(0.85); opacity: 0.85; }
        }
        @keyframes ai4 {
            0% { transform: rotate(270deg) translate(40%) scale(1); opacity: 0.95; }
            25% { transform: rotate(360deg) translate(40%) scale(0.8); opacity: 0.65; }
            50% { transform: rotate(450deg) translate(40%) scale(1.5); opacity: 0.6; }
            75% { transform: rotate(540deg) translate(40%) scale(0.95); opacity: 0.9; }
            100% { transform: rotate(630deg) translate(40%) scale(1); opacity: 0.95; }
        }

        .ai .c {
            position: absolute; width: 220px; aspect-ratio: 1; border-radius: 50%;
            filter: blur(7px);
        }
        .ai .c1 { background: radial-gradient(50% 50% at center, #60a5fa, #0078FE); width: 170px; animation: ai1 5.2s linear infinite; }
        .ai .c2 { background: radial-gradient(50% 50% at center, #ffffff, #bae6fd); width: 95px; animation: ai2 5.8s linear infinite; }
        .ai .c3 { background: radial-gradient(50% 50% at center, #38bdf8, transparent); width: 140px; animation: ai3 4.6s linear infinite; }
        .ai .c4 { background: radial-gradient(50% 50% at center, #1d4ed8, #1e3a8a); width: 160px; animation: ai4 5.0s linear infinite; }

        .ai .container {
            overflow: hidden;
            background: var(--orb-core);
            width: 100%;
            border-radius: 50%;
            aspect-ratio: 1;
            position: relative;
            display: grid;
            place-items: center;
            box-shadow: 0 14px 34px -6px rgba(0, 120, 254, 0.38), inset 0 0 18px rgba(0, 50, 140, 0.35);
        }

        .ai .glass {
            overflow: hidden;
            position: absolute;
            inset: calc(var(--p) - 2px);
            border-radius: 50%;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow:
                0 14px 32px rgba(0, 120, 254, 0.18),
                inset 0 2px 10px rgba(255, 255, 255, 0.92),
                inset 0 -8px 18px rgba(56, 189, 248, 0.42);
            background: radial-gradient(62px at 32% 24%, rgba(255, 255, 255, 0.88), rgba(255, 255, 255, 0.12) 55%, transparent 75%);
            display: flex; align-items: center; justify-content: center;
        }

        .orb-eq {
            display: flex; align-items: center; justify-content: center; gap: 3.5px;
            height: 28px; z-index: 4;
        }
        .orb-eq span {
            width: 3px; border-radius: 999px;
            background: rgba(255, 255, 255, 0.92);
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
            animation: eqPulse 0.85s ease-in-out infinite alternate;
        }
        .orb-eq span:nth-child(1) { height: 9px; animation-delay: 0.0s; }
        .orb-eq span:nth-child(2) { height: 18px; animation-delay: 0.15s; }
        .orb-eq span:nth-child(3) { height: 24px; animation-delay: 0.3s; }
        .orb-eq span:nth-child(4) { height: 15px; animation-delay: 0.12s; }
        .orb-eq span:nth-child(5) { height: 10px; animation-delay: 0.25s; }

        @keyframes eqPulse {
            0% { transform: scaleY(0.45); opacity: 0.7; }
            100% { transform: scaleY(1.15); opacity: 1; }
        }

        @keyframes circle1 {
            0%, 100% { transform: translate(-50%, -50%) scale(0.97); }
            50% { transform: translate(-50%, -50%) scale(1.02); }
        }
    </style>
</head>
<body>

    <div id="preview-toolbar" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 flex items-center gap-2 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md px-3.5 py-1.5 rounded-full shadow-md border border-black/5 dark:border-white/10 text-xs">
        <button id="toggle-orb-btn" class="px-3 py-1 rounded-full bg-[#0078FE] text-white font-semibold hover:opacity-95 transition">Toggle Voice Globe</button>
        <button id="toggle-theme-btn" class="px-3 py-1 rounded-full bg-gray-100 dark:bg-slate-800 text-gray-700 dark:text-slate-200 font-medium hover:opacity-90 transition">Light / Dark</button>
    </div>

    <footer class="footer-wrapper">
        <div class="container-ia-chat">
            <input type="checkbox" name="input-voice" id="input-voice" class="input-voice" checked />
            
            <input type="text" name="input-text" id="input-text" placeholder="Type a message..." class="input-text" autocomplete="off" />
            
            <div class="container-upload-files">
                <button type="button" title="Send Photo" class="upload-file">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24">
                        <g fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="13" r="3"></circle>
                            <path d="M9.778 21h4.444c3.121 0 4.682 0 5.803-.735a4.4 4.4 0 0 0 1.226-1.204c.749-1.1.749-2.633.749-5.697s0-4.597-.749-5.697a4.4 4.4 0 0 0-1.226-1.204c-.72-.473-1.622-.642-3.003-.702c-.659 0-1.226-.49-1.355-1.125A2.064 2.064 0 0 0 13.634 3h-3.268c-.988 0-1.839.685-2.033 1.636c-.129.635-.696 1.125-1.355 1.125c-1.38.06-2.282.23-3.003.702A4.4 4.4 0 0 0 2.75 7.667C2 8.767 2 10.299 2 13.364s0 4.596.749 5.697c.324.476.74.885 1.226 1.204C5.096 21 6.657 21 9.778 21Z"></path>
                        </g>
                    </svg>
                </button>
                <button type="button" title="Choose Image" class="upload-file">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24">
                        <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                            <rect width="18" height="18" x="3" y="3" rx="2" ry="2"></rect>
                            <circle cx="9" cy="9" r="2"></circle>
                            <path d="m21 15l-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path>
                        </g>
                    </svg>
                </button>
                <button type="button" title="Attach Document" class="upload-file">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24">
                        <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m6 14l1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"></path>
                    </svg>
                </button>
            </div>
            
            <button type="button" class="label-files" title="Add Attachment">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24">
                    <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 12h14m-7-7v14"></path>
                </svg>
            </button>

            <button type="button" class="btn-emoji" title="Insert Emoji">
                <i class="ph ph-smiley text-[21px]"></i>
            </button>
            
            <!-- Optical 3D Liquid Glass Voice Recorder -->
            <label for="input-voice" class="label-voice" title="Record Voice Message">
                <svg class="icon-voice" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
                    <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2" d="M12 4v16m4-13v10M8 7v10m12-6v2M4 11v2"></path>
                </svg>
                
                <div class="ai">
                    <div class="container">
                        <div class="c c4"></div>
                        <div class="c c1"></div>
                        <div class="c c2"></div>
                        <div class="c c3"></div>
                    </div>
                    <div class="glass">
                        <div class="orb-eq">
                            <span></span><span></span><span></span><span></span><span></span>
                        </div>
                    </div>
                </div>
                
                <div class="text-voice">
                    <div class="voice-header-row">
                        <span class="voice-rec-dot"></span>
                        <span id="voice-status-text" class="voice-status-title">Listening...</span>
                        <span id="voice-timer" class="voice-timer-badge">0:01</span>
                    </div>
                    <div class="voice-actions-row">
                        <button type="button" id="voice-cancel-btn" class="voice-action-btn voice-btn-cancel">
                            <i class="ph-bold ph-x text-[11px]"></i> Cancel
                        </button>
                        <button type="button" id="voice-transcribe-btn" class="voice-action-btn voice-btn-text">
                            <i class="ph-bold ph-text-aa text-[12px]"></i> Text
                        </button>
                        <button type="button" id="voice-send-btn" class="voice-action-btn voice-btn-send">
                            <i class="ph-bold ph-paper-plane-right text-[11px]"></i> Send
                        </button>
                    </div>
                </div>
            </label>
            
            <button id="btn-send" class="btn-send" title="Send Message">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" style="transform: translateX(-1px); margin-top: 1px;">
                    <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="m5 12l7-7l7 7m-7 7V5"></path>
                </svg>
            </button>
        </div>
    </footer>

    <script>
        const htmlEl = document.documentElement;
        const voiceInput = document.getElementById('input-voice');
        const inputText = document.getElementById('input-text');
        const voiceStatusText = document.getElementById('voice-status-text');
        const voiceTimer = document.getElementById('voice-timer');
        let recSeconds = 1;
        let recInterval = null;

        function startTimer() {
            clearInterval(recInterval);
            recSeconds = 1;
            voiceStatusText.textContent = 'Listening...';
            voiceTimer.textContent = '0:01';
            recInterval = setInterval(() => {
                recSeconds++;
                const s = String(recSeconds % 60).padStart(2, '0');
                voiceTimer.textContent = `0:${s}`;
            }, 1000);
        }

        startTimer();
        
        document.getElementById('toggle-orb-btn').addEventListener('click', () => {
            voiceInput.checked = !voiceInput.checked;
            if (voiceInput.checked) startTimer();
            else clearInterval(recInterval);
        });

        document.getElementById('toggle-theme-btn').addEventListener('click', () => {
            htmlEl.classList.toggle('dark');
        });

        document.getElementById('voice-cancel-btn').addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            clearInterval(recInterval);
            voiceInput.checked = false;
            if (window.AndroidVoiceOrb && window.AndroidVoiceOrb.onOrbCanceled) {
                window.AndroidVoiceOrb.onOrbCanceled();
            }
        });

        document.getElementById('voice-transcribe-btn').addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            voiceStatusText.textContent = 'Transcribing...';
            setTimeout(() => {
                clearInterval(recInterval);
                voiceInput.checked = false;
                inputText.value = 'Here is the latest update on the project.';
                inputText.focus();
            }, 600);
        });

        document.getElementById('voice-send-btn').addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            clearInterval(recInterval);
            voiceInput.checked = false;
            if (window.AndroidVoiceOrb && window.AndroidVoiceOrb.onOrbSent) {
                window.AndroidVoiceOrb.onOrbSent(recSeconds);
            }
        });

        window.updateOrbState = function(isDark, statusText) {
            htmlEl.classList.toggle('dark', Boolean(isDark));
            if (statusText) voiceStatusText.textContent = statusText;
        };

        voiceInput.addEventListener('change', function() {
            if (this.checked) startTimer();
            else clearInterval(recInterval);
        });
    </script>
</body>
</html>
