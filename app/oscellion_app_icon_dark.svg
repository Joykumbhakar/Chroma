<?xml version="1.0" encoding="utf-8"?>
<svg id="app-icon-svg-dark" class="svg-crisp" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
                <defs>
                    <!-- Dark Silver / Titanium Background -->
                    <linearGradient id="app-bg-dark" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#64748B"/>
                        <stop offset="50%" stop-color="#334155"/>
                        <stop offset="100%" stop-color="#0F172A"/>
                    </linearGradient>

                    <!-- Dark subtle grid pattern -->
                    <pattern id="grid-pattern-dark" width="32" height="32" patternUnits="userSpaceOnUse">
                        <circle cx="16" cy="16" r="1.5" fill="rgba(255,255,255,0.03)"/>
                    </pattern>

                    <!-- Silver/White Rim Edge (Dark Mode Outer Arc) -->
                    <linearGradient id="white-rim" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
                        <stop offset="100%" stop-color="#777777" stop-opacity="0.8"/>
                    </linearGradient>
                    
                    <!-- Silver Base Body -->
                    <linearGradient id="white-base" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#E2E8F0"/>
                        <stop offset="50%" stop-color="#94A3B8"/>
                        <stop offset="100%" stop-color="#475569"/>
                    </linearGradient>

                    <!-- Silver Gloss -->
                    <linearGradient id="white-gloss" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
                        <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.1"/>
                        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
                    </linearGradient>

                    <!-- Blue Gradients -->
                    <linearGradient id="blue-rim" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#BFDBFE" stop-opacity="1"/>
                        <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0.8"/>
                    </linearGradient>
                    
                    <linearGradient id="blue-base" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#60A5FA"/>
                        <stop offset="45%" stop-color="#2563EB"/>
                        <stop offset="100%" stop-color="#1E3A8A"/>
                    </linearGradient>

                    <linearGradient id="blue-gloss" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"/>
                        <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.1"/>
                        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
                    </linearGradient>

                    <!-- Dark Drop Shadow -->
                    <filter id="float-shadow" x="-20%" y="-20%" width="140%" height="140%">
                        <feDropShadow dx="0" dy="18" stdDeviation="15" flood-color="#000000" flood-opacity="0.60"/>
                    </filter>
                    
                    <!-- Neon Glow -->
                    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="12" result="blur"/>
                        <feComponentTransfer in="blur" result="fadedBlur">
                            <feFuncA type="linear" slope="0.8"/>
                        </feComponentTransfer>
                        <feComposite in="SourceGraphic" in2="fadedBlur" operator="over"/>
                    </filter>

                    <!-- Soft blur for specular highlights -->
                    <filter id="soft-highlight" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="3.5"/>
                    </filter>
                </defs>

                <rect width="512" height="512" fill="url(#app-bg-dark)"/>
                <rect width="512" height="512" fill="url(#grid-pattern-dark)"/>

                <g filter="url(#float-shadow)">
                    <!-- Outer Shadow -->
                    <path d="M 286 96 A 160 160 0 0 0 286 416" fill="none" stroke="#000000" stroke-width="40" stroke-linecap="round"/>
                    <!-- Middle Shadow -->
                    <path d="M 286 156 A 100 100 0 0 1 286 356" fill="none" stroke="#000000" stroke-width="40" stroke-linecap="round"/>
                    <!-- Inner Shadow -->
                    <path d="M 286 216 A 40 40 0 0 1 286 296" fill="none" stroke="#000000" stroke-width="40" stroke-linecap="round"/>
                </g>

                <!-- Subtle Glow for inner arcs -->
                <g filter="url(#neon-glow)">
                    <path d="M 286 156 A 100 100 0 0 1 286 356" fill="none" stroke="#3B82F6" stroke-width="40" stroke-linecap="round" opacity="0.3"/>
                    <path d="M 286 216 A 40 40 0 0 1 286 296" fill="none" stroke="#3B82F6" stroke-width="40" stroke-linecap="round" opacity="0.3"/>
                </g>

                <!-- OUTER ARC (White/Silver) -->
                <path d="M 286 96 A 160 160 0 0 0 286 416" fill="none" stroke="url(#white-rim)" stroke-width="40" stroke-linecap="round"/>
                <path d="M 286 96 A 160 160 0 0 0 286 416" fill="none" stroke="url(#white-base)" stroke-width="36" stroke-linecap="round"/>
                <path d="M 286 96 A 160 160 0 0 0 286 416" fill="none" stroke="url(#white-gloss)" stroke-width="12" stroke-linecap="round" filter="url(#soft-highlight)"/>

                <!-- MIDDLE BLUE ARC -->
                <path d="M 286 156 A 100 100 0 0 1 286 356" fill="none" stroke="url(#blue-rim)" stroke-width="40" stroke-linecap="round"/>
                <path d="M 286 156 A 100 100 0 0 1 286 356" fill="none" stroke="url(#blue-base)" stroke-width="36" stroke-linecap="round"/>
                <path d="M 286 156 A 100 100 0 0 1 286 356" fill="none" stroke="url(#blue-gloss)" stroke-width="10" stroke-linecap="round" filter="url(#soft-highlight)"/>

                <!-- INNER BLUE ARC -->
                <path d="M 286 216 A 40 40 0 0 1 286 296" fill="none" stroke="url(#blue-rim)" stroke-width="40" stroke-linecap="round"/>
                <path d="M 286 216 A 40 40 0 0 1 286 296" fill="none" stroke="url(#blue-base)" stroke-width="36" stroke-linecap="round"/>
                <path d="M 286 216 A 40 40 0 0 1 286 296" fill="none" stroke="url(#blue-gloss)" stroke-width="8" stroke-linecap="round" filter="url(#soft-highlight)"/>
            </svg>