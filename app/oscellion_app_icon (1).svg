<?xml version="1.0" encoding="utf-8"?>
<svg id="app-icon-svg" class="svg-crisp" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
                <defs>
                    
                    <!-- Deep Space/Dark Panel Icon Background -->
                    <linearGradient id="app-bg" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#1A1A24"/>
                        <stop offset="50%" stop-color="#0A0A12"/>
                        <stop offset="100%" stop-color="#050508"/>
                    </linearGradient>

                    <!-- Subtle background dot matrix / wireframe texture -->
                    <pattern id="grid-pattern" width="32" height="32" patternUnits="userSpaceOnUse">
                        <circle cx="16" cy="16" r="1.5" fill="rgba(255,255,255,0.03)"/>
                    </pattern>

                    <!-- Silver Rim Edge -->
                    <linearGradient id="silver-rim" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
                        <stop offset="100%" stop-color="#475569" stop-opacity="0.8"/>
                    </linearGradient>
                    
                    <!-- Silver Base Body -->
                    <linearGradient id="silver-base" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#F8FAFC"/>
                        <stop offset="50%" stop-color="#94A3B8"/>
                        <stop offset="100%" stop-color="#475569"/>
                    </linearGradient>

                    <!-- Silver Core Gloss / Specular (Softened) -->
                    <linearGradient id="silver-gloss" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
                        <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.1"/>
                        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
                    </linearGradient>

                    <!-- Blue Rim Edge -->
                    <linearGradient id="blue-rim" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#BFDBFE" stop-opacity="1"/>
                        <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9"/>
                    </linearGradient>
                    
                    <!-- Blue Base Body (Enhanced Oscellion Brand Blue) -->
                    <linearGradient id="blue-base" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#60A5FA"/>
                        <stop offset="45%" stop-color="#2563EB"/>
                        <stop offset="100%" stop-color="#1E3A8A"/>
                    </linearGradient>

                    <!-- Blue Core Gloss / Specular (Softened) -->
                    <linearGradient id="blue-gloss" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
                        <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.1"/>
                        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
                    </linearGradient>

                    <!-- High-quality SVG Drop Shadow Filter for floating effect -->
                    <filter id="float-shadow" x="-20%" y="-20%" width="140%" height="140%">
                        <feDropShadow dx="0" dy="18" stdDeviation="15" flood-color="#000000" flood-opacity="0.65"/>
                    </filter>
                    
                    <!-- Subtle Neon Glow Filter for the blue signals -->
                    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="8" result="blur"/>
                        <feComposite in="SourceGraphic" in2="blur" operator="over"/>
                    </filter>

                    <!-- NEW: Soft blur for specular highlights to blend perfectly without harsh lines -->
                    <filter id="soft-highlight" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="4"/>
                    </filter>
                </defs>

                <rect width="512" height="512" fill="url(#app-bg)"/>
                <rect width="512" height="512" fill="url(#grid-pattern)"/>

                <!-- The Core Signal Math: 
                     Upscaled x5.12 from original 100x100 viewBox.
                     Visually centered by shifting X origin +30px to X=286. 
                     Y origin remains centered at Y=256. -->

                <g filter="url(#float-shadow)">
                    <!-- Outer Shadow -->
                    <path d="M 286 96 A 160 160 0 0 0 286 416" fill="none" stroke="#000000" stroke-width="40" stroke-linecap="round"/>
                    <!-- Middle Shadow -->
                    <path d="M 286 156 A 100 100 0 0 1 286 356" fill="none" stroke="#000000" stroke-width="40" stroke-linecap="round"/>
                    <!-- Inner Shadow -->
                    <path d="M 286 216 A 40 40 0 0 1 286 296" fill="none" stroke="#000000" stroke-width="40" stroke-linecap="round"/>
                </g>

                <g opacity="0.15" filter="url(#neon-glow)">
                    <!-- Middle Glow -->
                    <path d="M 286 156 A 100 100 0 0 1 286 356" fill="none" stroke="#3B82F6" stroke-width="40" stroke-linecap="round"/>
                    <!-- Inner Glow -->
                    <path d="M 286 216 A 40 40 0 0 1 286 296" fill="none" stroke="#3B82F6" stroke-width="40" stroke-linecap="round"/>
                </g>

                <!-- OUTER SILVER ARC -->
                <!-- 1. Rim Light Edge (Thickest) -->
                <path d="M 286 96 A 160 160 0 0 0 286 416" fill="none" stroke="url(#silver-rim)" stroke-width="40" stroke-linecap="round"/>
                <!-- 2. Main Body Fill (Slightly thinner to reveal rim) -->
                <path d="M 286 96 A 160 160 0 0 0 286 416" fill="none" stroke="url(#silver-base)" stroke-width="36" stroke-linecap="round"/>
                <!-- 3. Specular Highlight (Now blurred for a smooth volumetric tube effect) -->
                <path d="M 286 96 A 160 160 0 0 0 286 416" fill="none" stroke="url(#silver-gloss)" stroke-width="12" stroke-linecap="round" filter="url(#soft-highlight)"/>

                <!-- MIDDLE BLUE ARC -->
                <!-- 1. Rim Light Edge -->
                <path d="M 286 156 A 100 100 0 0 1 286 356" fill="none" stroke="url(#blue-rim)" stroke-width="40" stroke-linecap="round"/>
                <!-- 2. Main Body Fill -->
                <path d="M 286 156 A 100 100 0 0 1 286 356" fill="none" stroke="url(#blue-base)" stroke-width="36" stroke-linecap="round"/>
                <!-- 3. Specular Highlight -->
                <path d="M 286 156 A 100 100 0 0 1 286 356" fill="none" stroke="url(#blue-gloss)" stroke-width="12" stroke-linecap="round" filter="url(#soft-highlight)"/>

                <!-- INNER BLUE ARC -->
                <!-- 1. Rim Light Edge -->
                <path d="M 286 216 A 40 40 0 0 1 286 296" fill="none" stroke="url(#blue-rim)" stroke-width="40" stroke-linecap="round"/>
                <!-- 2. Main Body Fill -->
                <path d="M 286 216 A 40 40 0 0 1 286 296" fill="none" stroke="url(#blue-base)" stroke-width="36" stroke-linecap="round"/>
                <!-- 3. Specular Highlight -->
                <path d="M 286 216 A 40 40 0 0 1 286 296" fill="none" stroke="url(#blue-gloss)" stroke-width="12" stroke-linecap="round" filter="url(#soft-highlight)"/>

            </svg>