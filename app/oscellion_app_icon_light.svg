<?xml version="1.0" encoding="utf-8"?>
<svg id="app-icon-svg-light" class="svg-crisp" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
                <defs>
                    <!-- Bright Metallic Silver Background -->
                    <linearGradient id="app-bg-light" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#F8FAFC"/>
                        <stop offset="50%" stop-color="#CBD5E1"/>
                        <stop offset="100%" stop-color="#94A3B8"/>
                    </linearGradient>

                    <!-- Dark subtle grid pattern -->
                    <pattern id="grid-pattern-light" width="32" height="32" patternUnits="userSpaceOnUse">
                        <circle cx="16" cy="16" r="1.5" fill="rgba(0,0,0,0.04)"/>
                    </pattern>

                    <!-- Graphite Rim Edge (Light Mode Outer Arc) -->
                    <linearGradient id="graphite-rim" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#94A3B8" stop-opacity="1"/>
                        <stop offset="100%" stop-color="#020617" stop-opacity="0.9"/>
                    </linearGradient>
                    
                    <!-- Graphite Base Body -->
                    <linearGradient id="graphite-base" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#475569"/>
                        <stop offset="50%" stop-color="#1E293B"/>
                        <stop offset="100%" stop-color="#0F172A"/>
                    </linearGradient>

                    <!-- Graphite Core Gloss (Subtler on dark surface) -->
                    <linearGradient id="graphite-gloss" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
                        <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.05"/>
                        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
                    </linearGradient>

                    <!-- Blue Gradients (Same as dark mode for brand consistency) -->
                    <linearGradient id="blue-rim-light" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#BFDBFE" stop-opacity="1"/>
                        <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9"/>
                    </linearGradient>
                    
                    <linearGradient id="blue-base-light" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#60A5FA"/>
                        <stop offset="45%" stop-color="#2563EB"/>
                        <stop offset="100%" stop-color="#1E3A8A"/>
                    </linearGradient>

                    <linearGradient id="blue-gloss-light" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"/>
                        <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.1"/>
                        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
                    </linearGradient>

                    <!-- Lighter Drop Shadow -->
                    <filter id="float-shadow-light" x="-20%" y="-20%" width="140%" height="140%">
                        <feDropShadow dx="0" dy="18" stdDeviation="15" flood-color="#000000" flood-opacity="0.20"/>
                    </filter>
                    
                    <!-- Soften Neon Glow for Light Mode -->
                    <filter id="neon-glow-light" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="6" result="blur"/>
                        <feComponentTransfer in="blur" result="fadedBlur">
                            <feFuncA type="linear" slope="0.6"/>
                        </feComponentTransfer>
                        <feComposite in="SourceGraphic" in2="fadedBlur" operator="over"/>
                    </filter>

                    <!-- Soft blur for specular highlights -->
                    <filter id="soft-highlight-light" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="3.5"/>
                    </filter>
                </defs>

                <rect width="512" height="512" fill="url(#app-bg-light)"/>
                <rect width="512" height="512" fill="url(#grid-pattern-light)"/>

                <g filter="url(#float-shadow-light)">
                    <!-- Outer Shadow -->
                    <path d="M 286 96 A 160 160 0 0 0 286 416" fill="none" stroke="#000000" stroke-width="40" stroke-linecap="round"/>
                    <!-- Middle Shadow -->
                    <path d="M 286 156 A 100 100 0 0 1 286 356" fill="none" stroke="#000000" stroke-width="40" stroke-linecap="round"/>
                    <!-- Inner Shadow -->
                    <path d="M 286 216 A 40 40 0 0 1 286 296" fill="none" stroke="#000000" stroke-width="40" stroke-linecap="round"/>
                </g>

                <!-- Subtle Glow -->
                <g filter="url(#neon-glow-light)">
                    <path d="M 286 156 A 100 100 0 0 1 286 356" fill="none" stroke="#3B82F6" stroke-width="40" stroke-linecap="round" opacity="0.12"/>
                    <path d="M 286 216 A 40 40 0 0 1 286 296" fill="none" stroke="#3B82F6" stroke-width="40" stroke-linecap="round" opacity="0.12"/>
                </g>

                <!-- OUTER GRAPHITE ARC -->
                <!-- 1. Rim Light Edge -->
                <path d="M 286 96 A 160 160 0 0 0 286 416" fill="none" stroke="url(#graphite-rim)" stroke-width="40" stroke-linecap="round"/>
                <!-- 2. Main Body Fill -->
                <path d="M 286 96 A 160 160 0 0 0 286 416" fill="none" stroke="url(#graphite-base)" stroke-width="36" stroke-linecap="round"/>
                <!-- 3. Blurred Specular Highlight -->
                <path d="M 286 96 A 160 160 0 0 0 286 416" fill="none" stroke="url(#graphite-gloss)" stroke-width="12" stroke-linecap="round" filter="url(#soft-highlight-light)"/>

                <!-- MIDDLE BLUE ARC -->
                <path d="M 286 156 A 100 100 0 0 1 286 356" fill="none" stroke="url(#blue-rim-light)" stroke-width="40" stroke-linecap="round"/>
                <path d="M 286 156 A 100 100 0 0 1 286 356" fill="none" stroke="url(#blue-base-light)" stroke-width="36" stroke-linecap="round"/>
                <path d="M 286 156 A 100 100 0 0 1 286 356" fill="none" stroke="url(#blue-gloss-light)" stroke-width="10" stroke-linecap="round" filter="url(#soft-highlight-light)"/>

                <!-- INNER BLUE ARC -->
                <path d="M 286 216 A 40 40 0 0 1 286 296" fill="none" stroke="url(#blue-rim-light)" stroke-width="40" stroke-linecap="round"/>
                <path d="M 286 216 A 40 40 0 0 1 286 296" fill="none" stroke="url(#blue-base-light)" stroke-width="36" stroke-linecap="round"/>
                <path d="M 286 216 A 40 40 0 0 1 286 296" fill="none" stroke="url(#blue-gloss-light)" stroke-width="8" stroke-linecap="round" filter="url(#soft-highlight-light)"/>

            </svg>